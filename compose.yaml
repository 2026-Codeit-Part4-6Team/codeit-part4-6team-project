services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/app.db}
      APP_ENV: ${APP_ENV:-development}
      DEMO_PAYMENT_ENABLED: ${DEMO_PAYMENT_ENABLED:-false}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-local-development-secret}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      NAVER_MAPS_API_KEY_ID: ${NAVER_MAPS_API_KEY_ID:-}
      NAVER_MAPS_API_KEY: ${NAVER_MAPS_API_KEY:-}
      GEOCODE_FALLBACK_ENABLED: ${GEOCODE_FALLBACK_ENABLED:-false}
      GEOCODE_FALLBACK_LAT: ${GEOCODE_FALLBACK_LAT:-37.4979}
      GEOCODE_FALLBACK_LNG: ${GEOCODE_FALLBACK_LNG:-127.0276}
      DAILY_FREE_LIMIT: ${DAILY_FREE_LIMIT:-10}
      BASIC_CREDIT_COST: ${BASIC_CREDIT_COST:-50}
      CONSULTANT_CREDIT_COST: ${CONSULTANT_CREDIT_COST:-10}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-60}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18000}:8000"
    volumes:
      - "./data:/app/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8501').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
