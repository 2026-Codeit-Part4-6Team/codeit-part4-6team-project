services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ${BACKEND_BUILD_TARGET:-actual}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/app.db}
      APP_ENV: ${APP_ENV:-development}
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-false}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-local-development-secret}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      NAVER_MAPS_API_KEY_ID: ${NAVER_MAPS_API_KEY_ID:-}
      NAVER_MAPS_API_KEY: ${NAVER_MAPS_API_KEY:-}
      GEOCODE_FALLBACK_ENABLED: ${GEOCODE_FALLBACK_ENABLED:-false}
      GEOCODE_FALLBACK_LAT: ${GEOCODE_FALLBACK_LAT:-37.4979}
      GEOCODE_FALLBACK_LNG: ${GEOCODE_FALLBACK_LNG:-127.0276}
      DAILY_FREE_LIMIT: ${DAILY_FREE_LIMIT:-10}
      BASIC_CREDIT_COST: ${BASIC_CREDIT_COST:-50}
      CONSULTANT_CREDIT_COST: ${CONSULTANT_CREDIT_COST:-10}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-180}
      MODEL_THREAD_POOL_WORKERS: ${MODEL_THREAD_POOL_WORKERS:-2}
      STALE_RECOVERY_SECONDS: ${STALE_RECOVERY_SECONDS:-120}
      VALIDATION_DYNAMIC_TOP_K: ${VALIDATION_DYNAMIC_TOP_K:-0}
      VALIDATION_TOP_K: ${VALIDATION_TOP_K:-3}
      VALIDATION_MAX_TOP_K: ${VALIDATION_MAX_TOP_K:-3}
      VALIDATION_RAG_ENABLED: ${VALIDATION_RAG_ENABLED:-1}
      VALIDATION_REQUIRE_LEGAL_KB: ${VALIDATION_REQUIRE_LEGAL_KB:-1}
      VALIDATION_MIN_KB_CHUNKS: ${VALIDATION_MIN_KB_CHUNKS:-30}
      CHATBOT_MODE: ${CHATBOT_MODE:-mock}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: ${HF_HOME:-/app/.cache/huggingface}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      MARKET_API_KEY: ${MARKET_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_AD_API_KEY: ${NAVER_AD_API_KEY:-}
      NAVER_AD_SECRET_KEY: ${NAVER_AD_SECRET_KEY:-}
      NAVER_AD_CUSTOMER_ID: ${NAVER_AD_CUSTOMER_ID:-}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18000}:8000"
    volumes:
      - "./data:/app/data"
      - "${HF_HOME_HOST_PATH:-./.cache/huggingface}:/app/.cache/huggingface"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8501').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
