[project]
name = "codeit-part4-6team-project"
version = "0.1.0"
description = "소상공인을 위한 생성형 AI 광고 콘텐츠 제작 서비스"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
backend = [
    "bcrypt>=4.2.0,<5.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]
frontend = [
    "httpx>=0.28.0,<1.0.0",
    "streamlit>=1.47.0,<2.0.0",
]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]
model-consult = [
    "httpx>=0.28.0,<1.0.0",
    "langgraph>=1.2.10,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "openai>=1.50.0,<3.0.0",
]
basic = [
    "faiss-cpu>=1.15.0",
    "langgraph>=1.2.10",
    "openai>=2.54.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
pythonpath = ["."]
testpaths = ["tests", "models"]
markers = [
    "live: 실제 외부 API 자격증명과 네트워크가 필요한 수동 검증",
]

[tool.ruff]
line-length = 100
target-version = "py311"
