name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run --locked --all-groups pytest

      - name: Run lint
        run: uv run --locked --group dev ruff check .

  deployment-assets:
    name: Deployment assets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare example deployment environment
        run: cp .env.example .env

      - name: Validate deployment Compose configuration
        env:
          IMAGE_BASE: example.invalid/team6
          IMAGE_TAG: ci
        run: docker compose -f compose.deploy.yaml config --quiet

      - name: Validate deployment script syntax
        run: bash -n scripts/deploy.sh

  compose-smoke-test:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        env:
          BACKEND_BUILD_TARGET: actual
          CHATBOT_MODE: mock
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Verify public health endpoints
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:18000/health", timeout=10) as response:
              assert response.status == 200
              assert json.load(response) == {"status": "ok"}

          with urllib.request.urlopen(
              "http://127.0.0.1:8501/", timeout=10
          ) as response:
              assert response.status == 200

          PY

      - name: Verify frontend-to-backend connection
        run: |
          docker compose exec -T frontend node --input-type=module - <<'JS'
          const response = await fetch(`${process.env.BACKEND_URL}/health`);
          if (!response.ok) throw new Error(`backend health failed: ${response.status}`);
          const result = await response.json();
          if (result.status !== "ok") throw new Error(`unexpected health: ${JSON.stringify(result)}`);
          JS

      - name: Print service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
