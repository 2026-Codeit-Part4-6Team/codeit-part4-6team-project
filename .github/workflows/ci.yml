name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run --locked --all-groups pytest

  compose-smoke-test:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Verify service flow
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:18000/health", timeout=10) as response:
              assert response.status == 200
              assert json.load(response) == {"status": "ok"}

          with urllib.request.urlopen(
              "http://127.0.0.1:8501/_stcore/health", timeout=10
          ) as response:
              assert response.status == 200

          request = urllib.request.Request(
              "http://127.0.0.1:18000/generate",
              data=json.dumps({"prompt": "CI 연결 테스트"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              body = json.load(response)
              assert response.status == 200
              assert body["status"] == "completed"
          PY

      - name: Print service logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
