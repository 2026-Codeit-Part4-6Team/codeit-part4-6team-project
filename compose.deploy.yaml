services:
  backend:
    image: ${IMAGE_BASE:?IMAGE_BASE is required}/backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: ${HF_HOME:-/app/.cache/huggingface}
      MODEL_THREAD_POOL_WORKERS: ${MODEL_THREAD_POOL_WORKERS:-2}
      VALIDATION_DYNAMIC_TOP_K: ${VALIDATION_DYNAMIC_TOP_K:-0}
      VALIDATION_TOP_K: ${VALIDATION_TOP_K:-3}
      VALIDATION_MAX_TOP_K: ${VALIDATION_MAX_TOP_K:-3}
      VALIDATION_RAG_ENABLED: ${VALIDATION_RAG_ENABLED:-1}
      VALIDATION_REQUIRE_LEGAL_KB: ${VALIDATION_REQUIRE_LEGAL_KB:-1}
      VALIDATION_MIN_KB_CHUNKS: ${VALIDATION_MIN_KB_CHUNKS:-30}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18000}:8000"
    volumes:
      - "${APP_DATA_DIR:-/srv/team6/data}:/app/data"
      - "${HF_HOME_HOST_PATH:-/srv/team6/models}:/app/.cache/huggingface"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  frontend:
    image: ${IMAGE_BASE:?IMAGE_BASE is required}/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8501').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
